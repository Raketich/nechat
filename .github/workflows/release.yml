name: Release

# The container is the deployable unit: CI gates merges, this ships the
# image to GHCR on every merge to main. Deployment to a host then is a
# `docker run` with the OpenRouter key injected at runtime.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      # Runtime smoke test before anything is published: run the freshly
      # built image and poke the endpoints the browser will rely on.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: nechat:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --rm --name nechat-smoke -p 8787:8787 \
            -e OPENROUTER_API_KEY=smoke-test-key \
            -e OPENROUTER_MODEL=google/gemma-4-31b-it:free \
            nechat:smoke
          sleep 3
          curl -fsS http://localhost:8787/api/health | grep -q '"ok":true'
          curl -fsS http://localhost:8787/ | grep -q '<div id="app">'
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8787/some/deep/route | grep -q 200
          curl -fsS -X POST http://localhost:8787/api/chat \
            -H 'Content-Type: application/json' \
            -d '{"messages":[{"role":"user","content":"hi"}]}' \
            --max-time 20 | grep -q '"type":"error"'
          docker stop nechat-smoke

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
